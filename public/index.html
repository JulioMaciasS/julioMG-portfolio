<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- SPA redirect decode (pairs with public/404.html) so deep links like
         /es/services resolve on static hosts such as GitHub Pages. -->
    <script type="text/javascript">
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location));
    </script>
    <!-- Primary favicon - browser tab icon (JM monogram, Space Grotesk) -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="%PUBLIC_URL%/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="%PUBLIC_URL%/favicon-16x16.png" />

    <!-- Apple Touch Icon -->
    <link rel="apple-touch-icon" sizes="180x180" href="%PUBLIC_URL%/apple-touch-icon.png" />

    <!-- Viewport settings -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <meta name="theme-color" content="#1a1717" />
    
    <!-- SEO Meta Tags - defaults, overridden per-page by react-helmet-async -->
    <meta name="description" content="Julio Macias Gonzalez's portfolio showcasing software engineering projects including web development, cloud architecture, and mobile applications." />
    <meta name="keywords" content="Julio Macias Gonzalez, software engineer, web developer, portfolio, projects, React, AWS, full-stack" />
    <meta name="author" content="Julio Macias Gonzalez" />
    
    <!-- Fonts and icons are now self-hosted (bundled via @fontsource and
         lucide-react / bootstrap-icons) so no third-party requests are made
         before the visitor consents. -->

    <!-- Web App Manifest -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Open Graph / Twitter defaults (overridden per-page by react-helmet-async).
         Absolute URLs track the live host; update when the domain moves to
         juliomacias.dev. -->
    <meta property="og:site_name" content="Julio Macias" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Julio Macias | Software Engineer & Consultant" />
    <meta property="og:description" content="Julio Macias — software engineer and consultant. Web development, cloud architecture and React/AWS consulting." />
    <meta property="og:url" content="https://portfolio.juliodev.co.uk" />
    <meta property="og:image" content="https://portfolio.juliodev.co.uk/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Julio Macias | Software Engineer & Consultant" />
    <meta name="twitter:description" content="Software engineer and consultant. Web development, cloud architecture and React/AWS consulting." />
    <meta name="twitter:image" content="https://portfolio.juliodev.co.uk/og-image.png" />

    <title>Julio Macias | Software Engineer & Consultant</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    
    <!-- Schema.org metadata for better SEO -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Julio Macias Gonzalez",
        "url": "https://portfolio.juliodev.co.uk",
        "sameAs": [
          "https://www.linkedin.com/in/julio-macias-gonzalez-199266282/",
          "https://github.com/JulioMaciasS"
        ],
        "jobTitle": "Software Engineer",
        "knowsAbout": ["Web Development", "React", "TypeScript", "AWS", "Cloud Architecture"]
      }
    </script>
  </body>
</html>
